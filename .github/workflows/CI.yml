name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  actions: write
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 4

  downgrade:
    # Resolve the *oldest* versions the [compat] bounds allow, and run the suite
    # against those.
    #
    # Without this the bounds are a claim nobody checks. `Reseau = "1"` admits
    # 1.0.1, and CI only ever saw 1.3.4 — a local checkout that happened to sit
    # on 1.0.1 failed on an API the package does not use but a test did. The
    # bound was truthful and the suite was not portable to it, which is the same
    # class of problem as an untruthful bound and just as invisible.
    name: Oldest compatible dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          # Standard libraries track the Julia version, so downgrading them is
          # meaningless and breaks resolution.
          skip: Sockets
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
